<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Advisor</title>
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #141414; color: #e0e0e0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 24px; gap: 24px; flex-wrap: wrap; }
  #board { width: 480px; max-width: 90vw; }
  .panel { width: 320px; max-width: 90vw; background: #202020; border-radius: 8px; padding: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: 1px; color: #8a8a8a; text-transform: uppercase; }
  .status { font-size: 12px; color: #7a7a7a; margin-bottom: 12px; font-family: ui-monospace, monospace; }
  .mate-banner { display: none; padding: 12px; margin-bottom: 12px; background: #3a1818; border: 1px solid #d43a3a; border-radius: 6px; text-align: center; font-weight: 700; color: #ff8888; letter-spacing: 1px; }
  .mate-banner.on { display: block; }
  .suggestion { padding: 10px 12px; margin-bottom: 8px; background: #2a2a2a; border-left: 3px solid #4a8a5a; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 14px; }
  .suggestion.mate { border-left-color: #d43a3a; background: #2e1e1e; }
  .suggestion .line { color: #777; font-size: 11px; margin-top: 5px; line-height: 1.5; }
  .suggestion .score { float: right; color: #a8c8a8; font-weight: 600; }
  .suggestion.mate .score { color: #e07070; }
  .controls { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .controls button { background: #333; color: #ddd; border: 1px solid #444; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .controls button:hover { background: #3e3e3e; }
  .move-input { margin-top: 12px; display: flex; gap: 8px; }
  .move-input input { flex: 1; background: #111; border: 1px solid #444; color: #eee; padding: 8px 10px; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 13px; }
  .move-input button { background: #4a8a5a; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .highlight-best { box-shadow: inset 0 0 0 3px #4a8a5a !important; }
  .highlight-mate { box-shadow: inset 0 0 0 3px #d43a3a !important; }
  .piece-417db { font-size: 47px; line-height: 60px; text-align: center; }
  .piece-417db.white-piece { color: #f0f0f0; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
  .piece-417db.black-piece { color: #1a1a1a; text-shadow: 1px 1px 0 #888, -1px -1px 0 #888, 1px -1px 0 #888, -1px 1px 0 #888; }
</style>
</head>
<body>
<div id="board"></div>
<div class="panel">
  <h2>Advisor</h2>
  <div class="mate-banner" id="mate-banner">MATE FOUND</div>
  <div class="status" id="status">ready</div>
  <div id="suggestions"></div>
  <div class="controls">
    <button id="btn-flip">Flip</button>
    <button id="btn-undo">Undo</button>
    <button id="btn-reset">Reset</button>
    <button id="btn-depth">Depth: 3</button>
  </div>
  <div class="move-input">
    <input id="move-input" type="text" placeholder="langkah manual, mis. e2e4" autocomplete="off">
    <button id="btn-move">Go</button>
  </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>
<script>
var game = new Chess();
var board = null;
var currentDepth = 3;
var thinking = false;
var $status = document.getElementById('status');
var $suggestions = document.getElementById('suggestions');
var $mateBanner = document.getElementById('mate-banner');
var PIECE_VALUE = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
var MATE_SCORE = 1000000;
var MATE_THRESHOLD = 999000;

var PST = {
  p: [0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
  n: [-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
  b: [-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
  r: [0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
  q: [-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
  k: [-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20]
};

var UNICODE_PIECES = {
  wK: '\u2654', wQ: '\u2655', wR: '\u2656', wB: '\u2657', wN: '\u2658', wP: '\u2659',
  bK: '\u265A', bQ: '\u265B', bR: '\u265C', bB: '\u265D', bN: '\u265E', bP: '\u265F'
};

function pieceRenderer(piece) {
  var isWhite = piece.charAt(0) === 'w';
  return '<span class="piece-417db ' + (isWhite ? 'white-piece' : 'black-piece') + '">' + UNICODE_PIECES[piece] + '</span>';
}

function setStatus(t) { $status.textContent = t; }

function evaluateBoard(g) {
  var score = 0;
  var b = g.board();
  for (var r = 0; r < 8; r++) {
    for (var c = 0; c < 8; c++) {
      var sq = b[r][c];
      if (!sq) continue;
      var idx = (sq.color === 'w' ? r : 7 - r) * 8 + c;
      var val = PIECE_VALUE[sq.type] + PST[sq.type][idx];
      score += (sq.color === 'w' ? 1 : -1) * val;
    }
  }
  return g.turn() === 'w' ? score : -score;
}

function search(g, depth, alpha, beta, ply) {
  if (g.in_checkmate()) return -MATE_SCORE + ply;
  if (g.in_draw() || g.in_stalemate() || g.insufficient_material()) return 0;
  if (depth === 0) return quiesce(g, alpha, beta, ply);
  var moves = g.moves({ verbose: true });
  orderMoves(moves);
  var best = -Infinity;
  for (var i = 0; i < moves.length; i++) {
    g.move({ from: moves[i].from, to: moves[i].to, promotion: moves[i].promotion });
    var s = -search(g, depth - 1, -beta, -alpha, ply + 1);
    g.undo();
    if (s > best) best = s;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  return best;
}

function quiesce(g, alpha, beta, ply) {
  if (g.in_checkmate()) return -MATE_SCORE + ply;
  if (g.in_draw() || g.in_stalemate() || g.insufficient_material()) return 0;
  var stand = evaluateBoard(g);
  if (stand >= beta) return beta;
  if (stand > alpha) alpha = stand;
  var caps = g.moves({ verbose: true }).filter(function (m) {
    return m.flags.indexOf('c') !== -1 || m.flags.indexOf('e') !== -1;
  });
  orderMoves(caps);
  for (var i = 0; i < caps.length; i++) {
    g.move({ from: caps[i].from, to: caps[i].to, promotion: caps[i].promotion });
    var s = -quiesce(g, -beta, -alpha, ply + 1);
    g.undo();
    if (s >= beta) return beta;
    if (s > alpha) alpha = s;
  }
  return alpha;
}

function orderMoves(moves) {
  moves.sort(function (a, b) {
    var av = a.captured ? PIECE_VALUE[a.captured] : 0;
    var bv = b.captured ? PIECE_VALUE[b.captured] : 0;
    if (a.promotion) av += 800;
    if (b.promotion) bv += 800;
    if (a.san && a.san.indexOf('#') !== -1) av += 5000;
    if (b.san && b.san.indexOf('#') !== -1) bv += 5000;
    return bv - av;
  });
}

function findMateIn1(g) {
  var moves = g.moves({ verbose: true });
  for (var i = 0; i < moves.length; i++) {
    g.move({ from: moves[i].from, to: moves[i].to, promotion: moves[i].promotion });
    var isMate = g.in_checkmate();
    g.undo();
    if (isMate) return moves[i];
  }
  return null;
}

function findMateIn2(g) {
  var moves = g.moves({ verbose: true });
  orderMoves(moves);
  for (var i = 0; i < moves.length; i++) {
    g.move({ from: moves[i].from, to: moves[i].to, promotion: moves[i].promotion });
    if (g.in_checkmate() || g.in_stalemate() || g.in_draw()) { g.undo(); continue; }
    var replies = g.moves({ verbose: true });
    var allMate = replies.length > 0;
    for (var j = 0; j < replies.length; j++) {
      g.move({ from: replies[j].from, to: replies[j].to, promotion: replies[j].promotion });
      var mated = g.in_checkmate();
      g.undo();
      if (!mated) { allMate = false; break; }
    }
    g.undo();
    if (allMate) return moves[i];
  }
  return null;
}

function findBestMoves(g, depth) {
  var m1 = findMateIn1(g);
  if (m1) return [{ move: m1, score: MATE_SCORE - 1, mate: 1 }];
  var m2 = findMateIn2(g);
  if (m2) return [{ move: m2, score: MATE_SCORE - 3, mate: 2 }];
  var moves = g.moves({ verbose: true });
  orderMoves(moves);
  var results = [];
  for (var i = 0; i < moves.length; i++) {
    g.move({ from: moves[i].from, to: moves[i].to, promotion: moves[i].promotion });
    var s = -search(g, depth - 1, -Infinity, Infinity, 1);
    g.undo();
    results.push({ move: moves[i], score: s, mate: null });
  }
  results.sort(function (a, b) { return b.score - a.score; });
  return results.slice(0, 3);
}

function highlightMove(from, to, isMate) {
  var els = document.querySelectorAll('.highlight-best, .highlight-mate');
  for (var i = 0; i < els.length; i++) els[i].classList.remove('highlight-best', 'highlight-mate');
  var cls = isMate ? 'highlight-mate' : 'highlight-best';
  [from, to].forEach(function (sq) {
    var el = document.querySelector('.square-' + sq);
    if (el) el.classList.add(cls);
  });
}

function renderResults(results) {
  $suggestions.innerHTML = '';
  var hasMate = results.length > 0 && (results[0].mate !== null || results[0].score > MATE_THRESHOLD);
  $mateBanner.className = 'mate-banner' + (hasMate ? ' on' : '');
  if (hasMate) {
    var n = results[0].mate || Math.ceil((MATE_SCORE - results[0].score) / 2);
    $mateBanner.textContent = 'MATE IN ' + n;
  }
  results.forEach(function (r, idx) {
    var mate = r.mate;
    var cp = r.score;
    if (mate === null && r.score > MATE_THRESHOLD) mate = Math.ceil((MATE_SCORE - r.score) / 2);
    else if (mate === null && r.score < -MATE_THRESHOLD) mate = -Math.ceil((MATE_SCORE + r.score) / 2);
    else if (mate === null) mate = null;
    if (mate !== null) cp = null;
    var div = document.createElement('div');
    div.className = 'suggestion' + (mate !== null ? ' mate' : '');
    var scoreText = mate !== null ? 'M' + Math.abs(mate) : ((cp >= 0 ? '+' : '') + (cp / 100).toFixed(2));
    div.innerHTML = '<span class="score">' + scoreText + '</span>#' + (idx + 1) + ' ' + r.move.san + '<div class="line">' + r.move.from + '\u2192' + r.move.to + '</div>';
    $suggestions.appendChild(div);
  });
  if (results[0]) {
    var isMate0 = results[0].mate !== null || results[0].score > MATE_THRESHOLD;
    highlightMove(results[0].move.from, results[0].move.to, isMate0);
  }
}

function runAnalysis() {
  if (thinking) return;
  thinking = true;
  setStatus('thinking depth ' + currentDepth + '\u2026');
  setTimeout(function () {
    var t0 = performance.now();
    var results = findBestMoves(game, currentDepth);
    var elapsed = Math.round(performance.now() - t0);
    renderResults(results);
    setStatus('ready \u00b7 depth ' + currentDepth + ' \u00b7 ' + elapsed + 'ms');
    thinking = false;
  }, 20);
}

function onDragStart(source, piece) {
  if (game.game_over()) return false;
  if ((game.turn() === 'w' && piece.indexOf('b') === 0) || (game.turn() === 'b' && piece.indexOf('w') === 0)) return false;
}

function onDrop(source, target) {
  var move = game.move({ from: source, to: target, promotion: 'q' });
  if (move === null) return 'snapback';
  board.position(game.fen());
  runAnalysis();
}

function onSnapEnd() { board.position(game.fen()); }

board = Chessboard('board', {
  draggable: true,
  position: 'start',
  onDragStart: onDragStart,
  onDrop: onDrop,
  onSnapEnd: onSnapEnd,
  pieceTheme: pieceRenderer
});

document.getElementById('btn-flip').onclick = function () { board.flip(); };
document.getElementById('btn-undo').onclick = function () {
  game.undo();
  board.position(game.fen());
  runAnalysis();
};
document.getElementById('btn-reset').onclick = function () {
  game = new Chess();
  board.position('start');
  $suggestions.innerHTML = '';
  $mateBanner.className = 'mate-banner';
  runAnalysis();
};
document.getElementById('btn-depth').onclick = function (e) {
  currentDepth = currentDepth === 3 ? 4 : currentDepth === 4 ? 2 : 3;
  e.target.textContent = 'Depth: ' + currentDepth;
  runAnalysis();
};

function applyManualMove() {
  var input = document.getElementById('move-input');
  var txt = input.value.trim().toLowerCase();
  if (!txt) return;
  var m = game.move(txt, { sloppy: true });
  if (m === null) {
    setStatus('langkah ilegal: ' + txt);
    return;
  }
  input.value = '';
  board.position(game.fen());
  runAnalysis();
}

document.getElementById('btn-move').onclick = applyManualMove;
document.getElementById('move-input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') applyManualMove();
});

runAnalysis();
</script>
</body>
</html>
